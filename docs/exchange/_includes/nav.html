<nav class="doc-nav" aria-label="{{ include.label }}">
  {%- for group in site.data.navigation %}
  <p class="doc-nav__section">{{ group.section }}</p>
  <ul class="doc-nav__list">
    {%- for item in group.items %}
    {%- assign target = site.pages | where: "path", item.path | first %}
    {%- if target %}
    <li><a class="doc-nav__link" href="{{ target.url | relative_url }}"{% if page.path == item.path %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
    {%- endif %}
    {%- endfor %}
  </ul>
  {%- endfor %}
</nav>
