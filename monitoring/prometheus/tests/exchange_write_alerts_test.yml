rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - one client removes more than 100 entries in an hour
    interval: 1m
    input_series:
      - series: 'basetool_exchange_removals_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="blueprint"}'
        values: "0+3x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeRemoveSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "An exchange client removed unusually many entries"
              description: "One registered client (client_id) removed more than 100 blueprints, stock lots or ships across its members in the last hour. The mass-change guard stops one member losing much at once, but not a faulty release doing it to many members. Follow the vault runbook \"Suspending an exchange client\": suspend the client under Administration - Verbundene Anwendungen, then let the affected members undo its changes (REQ-XCH-021, REQ-XCH-028)."

  - name: silent - ordinary removals
    interval: 1m
    input_series:
      - series: 'basetool_exchange_removals_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="stock"}'
        values: "0+1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeRemoveSpike
        exp_alerts: []

  - name: fires - the guard holds a client's batches again and again
    interval: 1m
    input_series:
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="stock", outcome="held"}'
        values: "0+1x70"
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="stock", outcome="applied"}'
        values: "0+50x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeGuardStorm
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "The mass-change guard keeps holding one client's batches"
              description: "The mass-change guard held back more than 10 change sets of one registered client (client_id) in the last hour. Members will see many confirmation links; a client that deletes by mistake, or a release that sends removals where it should not, looks like this. Check the client's recent writes and consider suspending it (vault runbook \"Suspending an exchange client\", REQ-XCH-021)."

  - name: silent - many applied writes and a few held batches
    interval: 1m
    input_series:
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="blueprint", outcome="held"}'
        values: "0x30 1x40"
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="blueprint", outcome="applied"}'
        values: "0+100x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeGuardStorm
        exp_alerts: []

  - name: fires - a surge of new installations of one client
    interval: 1m
    input_series:
      - series: 'basetool_exchange_installations_created_total{job="basetool-backend", instance="backend:11261", client_id="versekit"}'
        values: "0+1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeInstallationSurge
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "Many new installations of one exchange client"
              description: "More than 20 new installations of one registered client (client_id) connected in the last hour. A release day can explain it; a device-code phishing wave or a leaked client cannot. Check the new-connection notifications and the installations on the admin page, and suspend the client if the connections are not expected (REQ-XCH-007, REQ-XCH-028)."

  - name: silent - a few new installations
    interval: 1m
    input_series:
      - series: 'basetool_exchange_installations_created_total{job="basetool-backend", instance="backend:11261", client_id="versekit"}'
        values: "0x30 5x40"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeInstallationSurge
        exp_alerts: []

  - name: fires - tokens of a client outside the registry keep arriving
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11262", client_id="unregistered", reason="client_not_allowed"}'
        values: "0+2x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeUnknownClient
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Exchange tokens of a client outside the registry"
              description: "The ingest gateway refused more than 10 exchange requests in 15 minutes that carried a valid token of a Keycloak client the registry does not list. Either a client was provisioned in Keycloak but not registered yet, or a client id is being used that should not be. Register the client deliberately or remove it from Keycloak (REQ-XCH-003, REQ-XCH-028)."

  - name: silent - refusals of registered clients do not count
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11262", client_id="versekit", reason="scope_missing"}'
        values: "0+5x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeUnknownClient
        exp_alerts: []
